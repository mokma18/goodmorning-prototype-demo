*, *::before, *::after { box-sizing: border-box; }

body { background: #eef7fc; }
.brand-banner { mix-blend-mode: multiply; }
.bottom-nav { background: #eef7fc; border-color: #d6e7f1; }
.home-cover { background: #eef7fc; border: 1px solid #d6e7f1; box-shadow: 1px 6px 12px #39596e13; }

}

.topbar .gyro-icon { margin: 0; border-color: #587a91; }

.fullscreen-icon { display: grid; grid-template-columns: repeat(2, 7px); gap: 4px; color: #456b84; }
.fullscreen-icon i {

}
.fullscreen-icon i:nth-child(2) { transform: rotate(90deg); }
.fullscreen-icon i:nth-child(3) { transform: rotate(-90deg); }
.fullscreen-icon i:nth-child(4) { transform: rotate(180deg); }
#reading-mode[aria-pressed="true"] { background: #dceef8; }

.distance-camera { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.distance-status { color: #38576a; font-size: .8rem; margin: 10px 0 0; }
.mouse-turning { cursor: grabbing; }
.handwritten, .diary figcaption { font-family: 'Gaegu', 'Segoe Print', 'Malgun Gothic', cursive; font-weight: 700; }
.home-art { position: relative; display: grid; place-items: center; min-height: 0; }
.home-art .cover-photo {
  width: 58%; height: 94%; min-height: 0; object-fit: cover; transform: rotate(-6deg);
  border: 7px solid #fff; border-bottom-width: 16px; box-shadow: 0 5px 10px #362a2533;
}
.home-art .cover-magnet {
  position: absolute; right: 11%; bottom: 1%; width: 28%; aspect-ratio: 1;
  object-fit: contain; filter: drop-shadow(2px 5px 3px #46332170);
}
.browse-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.browse-card { aspect-ratio: 3 / 4; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; padding: 9%; }
.browse-card .handwritten { font-size: clamp(1.3rem, 4.5vw, 1.9rem); }
.browse-card .cover-photo { width: 81%; }
.browse-card .cover-magnet { width: 39%; right: -1%; }
#collection h2 { font-size: 1rem; margin: 18px 0 10px; }
.collection-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.collection-grid button {
  display: grid; gap: 8px; justify-items: center; padding: 10px 4px;
  border: 1px solid #c9dfe9; background: #e6f2fa; color: inherit; font-size: .85rem;
}
.collection-grid:last-child button { background: #e1eef7; }
.collection-grid button:hover { border-color: #83a9bf; }
.collection-grid img { width: 85%; aspect-ratio: 1; object-fit: contain; }
#asset-preview { width: min(calc(100% - 24px), 416px); max-height: calc(100dvh - 24px); padding: 16px; border: 1px solid #c9dfe9; border-radius: 12px; background: #eef7fc; color: #18384c; }
#asset-preview::backdrop { background: #0006; }
.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.preview-head h2 { margin: 0; font-size: 1.03rem; }
.preview-stage { position: relative; aspect-ratio: 1; touch-action: none; cursor: grab; }
.preview-stage img, .preview-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.preview-stage img { padding: 13%; }
#preview-status { font-size: .8rem; color: #666; margin: 4px 0; }
.preview-angle { display: flex; align-items: center; gap: 12px; margin: 12px 0; font-size: .85rem; }
.preview-angle input { flex: 1; min-width: 0; }
#preview-diary { text-decoration: none; }
.actions { display: flex; gap: 8px; }
.button {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 0 13px; border: 1px solid #dedede;
  border-radius: 7px; background: #fff; color: inherit; font-size: .875rem;
}
.button:hover:not(:disabled), summary:hover { border-color: #999; }
.primary { background: #161616; border-color: #161616; color: #fff; }

.post {
  position: relative; isolation: isolate; overflow: hidden;
  aspect-ratio: 1; border-block: 1px solid #e7e7e7;
}
.post.is-editing { touch-action: none; }
.book-stage { position: relative; width: 100%; }
.reading-mode .book-stage { display: grid; justify-items: center; }
.diary-demo:not(.reading-mode) .book-stage:has(> .diary-bookmarks:not([hidden])):not(:has(> .post.is-editing)) {
  --bookmark-gutter: 46px;
  padding-inline-end: var(--bookmark-gutter);
  transform: perspective(850px) scale(var(--book-zoom, 1)) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transform-origin: calc((100% - var(--bookmark-gutter)) / 2) center;
  transform-style: preserve-3d;
  transition: transform 75ms ease-out;
}
.diary-demo:not(.reading-mode) .book-stage:has(> .diary-bookmarks:not([hidden])) > .post:not(.is-editing) {
  transform: none; transition: none;
}
.diary-bookmarks {
  position: absolute; inset: 11% 0 7% auto;
  width: var(--bookmark-gutter, 46px); padding: 3px 2px 4px 0;
  display: flex; flex-direction: column; gap: 7px;
  overflow: auto; scrollbar-width: none;
}
.reading-mode .diary-bookmarks, .book-stage:has(> .post.is-editing) > .diary-bookmarks { display: none; }
.product-bookmark {
  flex: 0 0 auto; min-height: 44px; width: 100%; padding: 4px 3px 4px 2px;
  display: grid; place-items: center; gap: 1px;
  text-align: center; color: #425565; cursor: pointer;
  background: linear-gradient(90deg, #a99a843b, transparent 6px), var(--tab-paper, #eadbbf);
  border: 1px solid #9c896550; border-left: 0; border-radius: 0 7px 7px 0;
  box-shadow: 1px 1px 2px #273f4c1f;
}
.product-bookmark:nth-child(3n + 2) { --tab-paper: #dbe8de; }
.product-bookmark:nth-child(3n + 3) { --tab-paper: #eaddeb; }
.product-bookmark:hover { filter: brightness(1.07); }
.product-bookmark:focus-visible { outline-offset: -3px; }
.product-bookmark img { width: 33px; max-width: 100%; height: 33px; object-fit: contain; }
.product-bookmark span { max-width: 100%; font-size: .68rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 479px) {
  .product-bookmark:has(img:not([hidden])) span { display: none; }
}
@media (min-width: 480px) {
  .diary-demo:not(.reading-mode) .book-stage:has(> .diary-bookmarks:not([hidden])):not(:has(> .post.is-editing)) { --bookmark-gutter: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  .diary-demo:not(.reading-mode) .book-stage:has(> .diary-bookmarks:not([hidden])):not(:has(> .post.is-editing)) { transition: none; }
}
#layers { position: absolute; inset: 0; }
.polaroid {
  position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
  width: 74%; aspect-ratio: 1; margin: 0; padding: 3% 6% 9%;
  display: grid; place-items: center; background: #fff; min-height: 0;
  border: 1px solid #e5e5e5; box-shadow: 0 3px 12px #00000016;
  pointer-events: none;
}
.polaroid img { display: block; width: 100%; height: auto; min-height: 0; aspect-ratio: 1; object-fit: cover; }
.polaroid::before {
  content: ""; position: absolute; top: -8px; left: 33%; width: 34%; height: 23px;
  transform: rotate(-6deg); background: #e9d59bbd;
  clip-path: polygon(2% 0, 100% 3%, 97% 24%, 100% 45%, 97% 65%, 100% 96%, 0 100%, 3% 74%, 0 52%, 3% 30%);
}
.post.has-photo .model canvas {
  filter: drop-shadow(1px 2px 1px #35282199)
    drop-shadow(var(--contact-x, 2px) var(--contact-y, 4px) 3px #38261540);
}
.post.has-photo .model.magnet canvas {
  filter: drop-shadow(1px 2px 1px #35281856);
}
.post.has-photo .model.gloss-sticker canvas,
.post.has-photo .model.gloss-sticker .model-preview { filter: drop-shadow(0 2px 1px #392c2e75); }
.diary-demo .page { width: min(100%, 568px); }
.diary-demo .post {
  aspect-ratio: 3 / 4; border: 1px solid #6d809331; border-radius: 7px 11px 11px 7px;
  transform: perspective(850px) scale(var(--book-zoom, 1)) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transition: transform 75ms ease-out;
  box-shadow: 0 2px 0 #9aafbd40, 0 4px 0 #b3c3cd40, 0 12px 24px -15px #314b5a66;
}
.diary-demo .post.is-editing { transform: none; transition: none; }
@media (prefers-reduced-motion: reduce) { .diary-demo .post { transition: none; } }
.diary {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 25px, #302c4813 25px 26px) var(--paper, #fffdf8);
  box-shadow: inset 16px 0 19px -22px #80694b, inset 0 0 0 1px #eae4dc;
}
.diary::before, .diary::after {
  content: ""; position: absolute; pointer-events: none;
}
.diary::before {
  inset: 0 auto 0 0; width: 5%;
  background: linear-gradient(90deg, #59636a2b, #283a4c0d 60%, transparent);
}
.diary::after {
  inset: auto 0 0 0; height: 1.25%;
  background: repeating-linear-gradient(0deg, #51687921 0 1px, #fff7 1px 2px);
}
.diary > .diary-wordmark {
  position: absolute; top: 4%; left: 36%; width: 28%; height: 8%;
  object-fit: contain;
}
.diary figure {
  position: absolute; width: 68%; margin: 0; container-type: inline-size;
  display: grid; grid-template-rows: auto auto; align-content: start;
  padding: clamp(3px, 1.9cqw, 12px) clamp(3px, 1.9cqw, 12px) clamp(4px, 2.35cqw, 14px);
  background: white; box-shadow: 1px 5px 13px #46372529;
}
.diary figure::before {
  content: ""; position: absolute; top: -4%; left: 27%; width: 46%; height: 10%;
  background: #e8cf98ba; transform: rotate(-5deg);
}
.diary figure { transform: rotate(calc(var(--photo-tilt, 0deg) + var(--placement-angle, 0deg))); }
.diary figure:nth-child(1) { --photo-tilt: -5deg; }
.diary figure:nth-child(2) { --photo-tilt: 4deg; }
.diary figure:nth-child(3) { --photo-tilt: -3deg; }
.diary figure > img {
  display: block; width: 100%; height: auto; aspect-ratio: 1;
  object-fit: cover; object-position: 50% 43%;
}
.diary figure[data-photo-source="theater"] > img { object-position: 50% 86%; }
.diary figure[data-photo-source="photozone"] > img { object-position: 50% 80%; }
.is-editing .diary figure { pointer-events: auto; touch-action: none; cursor: move; user-select: none; }
.is-editing .diary img { pointer-events: none; }
#diary-controls:not([hidden]) { margin-bottom: 10px; }
.diary figcaption {
  padding-top: clamp(3px, 4cqw, 10px);
  color: #382e35; text-align: center;
  font-size: clamp(.68rem, 9.5cqw, 1.9rem); line-height: 1.15; overflow-wrap: anywhere;
}
.diary figcaption:empty { padding-top: 0; }
.diary figure:not(.blank-diary-card) {
  --square-caption-size: clamp(.61rem, 6.6cqw, 1.5rem);
  --square-photo-top: clamp(2px, 3.8cqw, 11px);
  --square-photo-foot: clamp(2px, 2cqw, 6px);
  aspect-ratio: 1; grid-template-rows: auto minmax(0, 1fr);
  align-content: stretch; padding: 0;
}
.diary figure:not(.blank-diary-card) > img {
  justify-self: center; margin-top: var(--square-photo-top);
  width: min(86%, calc(100cqw - var(--square-photo-top) - var(--square-photo-foot) - 2.24 * var(--square-caption-size)));
}
.diary figure:not(.blank-diary-card) > figcaption {
  align-self: center; margin: 0 clamp(2px, 4cqw, 12px) var(--square-photo-foot);
  padding-top: 0; font-size: var(--square-caption-size); line-height: 1.12;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#enable-tilt { margin-top: 12px; }
#enable-tilt[aria-pressed="true"] { background: #fff4d4; border-color: #d3a74a; }
.gyro-icon { width: 24px; height: 24px; position: relative; margin-right: 6px; border: 1.5px solid #6b7280; border-radius: 50%; }
.gyro-icon::before, .gyro-icon::after { content: ""; position: absolute; inset: 2px 6px; border: 1px solid #646c7a; border-radius: 50%; transform: rotate(37deg); }
.gyro-icon::after { transform: rotate(-53deg); border-color: #9a6b1b; }
.gyro-icon i { position: absolute; inset: 7px; border-radius: 50%; background: #dca839; }
.photo-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.model {
  position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(var(--placement-angle, 0deg));
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  outline-offset: -3px;
}
.model canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
.model-preview {
  position: absolute; inset: 10%; width: 80%; height: 80%; object-fit: contain;
  filter: drop-shadow(2px 4px 3px #38261566); pointer-events: none;
}
.model-ready .model-preview { visibility: hidden; }
.model.preview-first :is(canvas, .model-preview) { transition: opacity 140ms ease; }
.model.preview-first canvas { opacity: 0; }
.model.preview-first.model-ready canvas { opacity: 1; }
.model.preview-first.model-ready .model-preview { visibility: visible; opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .model.preview-first :is(canvas, .model-preview) { transition: none; }
}
.model.dragging { cursor: grabbing; }
.post.is-editing .model { cursor: move; }
.post.is-editing .model[aria-pressed="true"] { outline: 1px dashed #999; outline-offset: -2px; }
.model-status, .empty {
  position: absolute; margin: 0; inset: 0; display: grid; place-items: center;
  text-align: center; padding: 8px; color: #5c5c5c; font-size: .875rem; pointer-events: none;
}

.products { list-style: none; margin: 0; padding: 0; }
.product {
  min-height: 52px; padding: 8px 0; border-bottom: 1px solid #e7e7e7;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-size: .875rem;
}
.product-name { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.product a { white-space: nowrap; padding: 8px 0; text-underline-offset: 3px; }
#product-card {
  width: min(calc(100% - 28px), 410px); max-width: none;
  max-height: 86dvh; padding: 19px; margin: auto;
  overflow: auto; overscroll-behavior: contain;
  border: 1px solid #c6d8e0; border-radius: 13px;
  background: #fffdf7; color: #253f50; box-shadow: 0 20px 40px #1b344043;
}
#product-card::backdrop { background: #25394c70; }
.product-card-head {
  padding-bottom: 12px; border-bottom: 1px dashed #b5c8d0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
#product-card-title { margin: 5px 0 0; font-size: 1.13rem; line-height: 1.32; min-width: 0; overflow-wrap: anywhere; }
.product-card-head .button {
  min-width: 53px; min-height: 44px; padding-inline: 8px; white-space: nowrap;
  border-color: #cbdfea; background: #f4fafd;
}
#product-card-note { margin: 12px 0; font-size: .87rem; line-height: 1.5; color: #516672; }
#product-card-note:empty, #product-card-image:not([src]), #product-card-facts:empty, #product-card-links:empty { display: none; }
#product-card-image {
  display: block; width: 100%; height: clamp(108px, 28dvh, 180px); margin: 12px 0 0;
  object-fit: contain; border-radius: 8px;
  background: #fff; border: 1px solid #dce7ec;
}
#product-card-facts {
  display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 11px;
  margin: 14px 0; font-size: .87rem; line-height: 1.46;
}
#product-card-facts > div { display: contents; }
#product-card-facts dt { font-weight: 700; }
#product-card-facts dd { margin: 0; overflow-wrap: anywhere; }
#product-card-links {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 7px;
  margin-top: 13px;
}
#product-card-links a {
  display: grid; place-items: center; padding: 8px; min-height: 44px;
  border: 1px solid #b6d3e1; border-radius: 6px;
  background: #e4f1f7; color: #24485f; text-decoration: none; text-align: center;
  font-size: .88rem; font-weight: 700; overflow-wrap: anywhere;
}
#product-card-links a:hover { background: #d9edf5; }
.diary-demo .products { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid #ececec; margin-top: 12px; }
.diary-demo .products:has(.product:only-child) { grid-template-columns: 1fr; }
.diary-demo .product { min-width: 0; padding: 0; border: 0; }
.diary-demo .product + .product { border-left: 1px solid #ededed; }
.diary-demo .goods-card {
  display: flex; align-items: center; gap: clamp(4px, 1.25vw, 10px);
  min-width: 0; width: 100%; min-height: 70px; padding: 7px clamp(4px, 1.5vw, 10px);
  text-decoration: none;
}
.diary-demo a.goods-card:hover { background: #f7f7f7; }

.tape-choice[data-tape="smile"]::before { content: "☺ ☺ ☺"; }
.tape-choice[data-tape="none"]::before { background: transparent; border-bottom: 1px solid #9cb4c4; }

.menu-icon {
  --ink: #29243b;
  position: relative;
  display: block;
  width: 44px;
  height: 35px;
  flex: none;
  isolation: isolate;
}

.menu-icon i,
.menu-icon b,
.menu-icon em,
.menu-icon::before,
.menu-icon::after,
.menu-icon i::before,
.menu-icon i::after {
  position: absolute;
  display: block;
}

.menu-icon::before,
.menu-icon::after,
.menu-icon i::before,
.menu-icon i::after {
  content: "";
}

.menu-icon::before {
  inset: auto 5px 1px;
  height: 5px;
  z-index: -1;
  border-radius: 50%;
  background: #382c4520;
  filter: blur(1px);
}

.menu-icon--house i {
  inset: 11px 6px 4px;
  border: 1px solid #536683;
  border-radius: 2px;
  background: linear-gradient(96deg, #d1eafb, #fef8ef 56%, #ebdfed);
  box-shadow: inset 2px 0 #ffffff8c;
}

.menu-icon--house i::before {
  inset: 3px 5px auto;
  height: 6px;
  border: 1px solid #6d94af;
  border-radius: 1px;
  background: repeating-linear-gradient(90deg, #9dc6e2 0 4px, #edf7ff 4px 5px);
}

.menu-icon--house i::after {
  inset: auto 5px 0;
  height: 6px;
  background: linear-gradient(90deg, #93bcd7 0 44%, transparent 44% 66%, #915c4f 66% 92%, transparent 92%);
  box-shadow: inset 0 1px #53668340;
}

.menu-icon--house b {
  inset: 2px 3px auto;
  height: 13px;
  clip-path: polygon(50% 0, 100% 86%, 95% 100%, 5% 100%, 0 86%);
  background: repeating-linear-gradient(#a94a4e00 0 2px, #a94a4e65 2px 3px), linear-gradient(#f08d7f, #bb4f5d);
}

.menu-icon--house em {
  inset: 23px 3px auto;
  height: 4px;
  clip-path: polygon(15% 0, 84% 0, 100% 100%, 0 100%);
  background: linear-gradient(#e48470, #a84455);
}

.menu-icon--house::after {
  inset: auto 4px 2px;
  height: 3px;
  border-radius: 65%;
  background: #8ea975;
}

.menu-icon--chest i {
  inset: 17px 4px 4px;
  border: 1px solid #563132;
  border-radius: 2px 2px 5px 5px;
  background: repeating-linear-gradient(90deg, transparent 0 10px, #d3ae66 10px 12px), linear-gradient(#ac5763, #70303e);
  box-shadow: inset 0 0 0 1px #d3ae66, inset 0 -3px #51202d4d;
}

.menu-icon--chest b {
  inset: 5px 4px auto;
  height: 13px;
  border: 1px solid #563132;
  border-radius: 20px 20px 4px 4px;
  transform: rotate(-6deg);
  background: repeating-linear-gradient(104deg, transparent 0 8px, #d3ae66 9px 11px), linear-gradient(#d67a81, #8b3e50);
  box-shadow: inset 0 0 0 1px #e4c480, inset 0 2px #fff5cc60, 0 1px #543132;
}

.menu-icon--chest em {
  top: 16px;
  left: 19px;
  width: 7px;
  height: 8px;
  border: 1px solid #653d37;
  border-radius: 2px 2px 4px 4px;
  background: radial-gradient(circle at 50% 57%, #6f453f 0 1px, transparent 1.3px), #f1cc77;
}

.menu-icon--diary { display: grid; place-items: center; width: 52px; height: 39px; }
.menu-icon--diary .diary-cover { width: 28px; transform: translateX(-1px) rotate(-9deg); }

/* The safe and menu share the same closed binder. */
.diary-cover {
  --binder-shadow: 1px 2px 2px #263e544b;
  border-color: #809ba8;
  border-radius: 8% 8% 8% 7% / 6%;
  background:
    linear-gradient(90deg, #89a7b6b0, #a7c3cda0 13%, transparent 16%),
    linear-gradient(135deg, #e6f2f5, #c5d9e1 68%, #a9c6d2);
  box-shadow: inset 1px 1px #ffffffb5, inset -1px -1px #6b93a75e, var(--binder-shadow);
}

.diary-cover.safe-book { --binder-shadow: 6px 10px 13px #11172288; }

.diary-cover::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 5% 6% 5% 14%;
  border: 1px solid #98b1bb9e;
  border-radius: 7% 7% 7% 4% / 5%;
  background:
    linear-gradient(135deg, #e0f0f4b5, transparent 63%, #cae0e89e),
    linear-gradient(90deg, #b4cbd57d, transparent 12%),
    #fbf7ea;
  box-shadow: inset 0 -2px #c3c4b575, inset 0 -3px #fffdf2a5, 1px 1px #ffffff96;
}

.diary-cover::after {
  z-index: 1;
  inset: 48% -3% auto auto;
  width: 30%;
  height: 17%;
  border: 1px solid #7895a3;
  border-radius: 32% 27% 27% 32% / 50%;
  background:
    radial-gradient(circle at 35% 46%, #f5fafc 0 10%, #9eafb8 12% 20%, #718792 24% 27%, transparent 30%),
    linear-gradient(155deg, #f4feffbb, #b7d4e2c4 48%, #97b5c3d1);
  box-shadow: inset 0 1px #ffffffac, 0 1px 2px #425a626b;
}

.diary-cover-title { top: 17%; left: 24%; width: 46%; }

.diary-cover-holes {
  inset: 15% auto 15% -3%;
  display: grid;
  width: 15%;
  grid-template-rows: repeat(3, minmax(0, 1fr)) minmax(0, 2.1fr) repeat(3, minmax(0, 1fr));
  align-items: center;
}

.diary-cover-holes span:nth-child(4) { grid-row: 5; }
.diary-cover-holes span:nth-child(5) { grid-row: 6; }
.diary-cover-holes span:nth-child(6) { grid-row: 7; }

.diary-cover-holes span {
  position: relative;
  aspect-ratio: 3.2;
  max-height: 9px;
  border-radius: 60%;
  background: linear-gradient(#e8f4f9 7%, #93a5af 36%, #ffffff 52%, #687c88 83%);
  box-shadow: 0 1px 1px #394f5e80;
}

.diary-cover-holes span::after {
  content: "";
  position: absolute;
  top: 22%;
  right: 5%;
  width: 17%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #607c89;
}

.menu-icon--peek i,
.menu-icon--peek b {
  top: 10px;
  width: 18px;
  height: 20px;
  border: 1px solid #6b597b;
  border-radius: 3px;
  background: repeating-linear-gradient(to bottom, transparent 0 3px, #ad9ac370 3px 4px), #fff4dc;
  box-shadow: 0 2px #a987af;
}

.menu-icon--peek i {
  left: 5px;
  transform: skewY(12deg);
  transform-origin: right bottom;
}

.menu-icon--peek b {
  right: 5px;
  transform: skewY(-12deg);
  transform-origin: left bottom;
}

.menu-icon--peek em {
  inset: 3px auto auto 16px;
  width: 14px;
  height: 12px;
  border: 1px solid #6b597b;
  border-radius: 50%;
  transform: rotate(-8deg);
  background: radial-gradient(circle at 34% 48%, var(--ink) 0 1px, transparent 1.5px),
    radial-gradient(circle at 69% 48%, var(--ink) 0 1px, transparent 1.5px),
    radial-gradient(circle at 25% 75%, #f4a5ae 0 1px, transparent 1.5px),
    radial-gradient(circle at 76% 75%, #f4a5ae 0 1px, transparent 1.5px),
    #fbdfbf;
}

/* The front stays at z = 0. Perpendicular faces meet it and end at the back plane. */
.post.solid-board {
  overflow: visible;
  isolation: auto;
  container-type: normal;
  transform-style: preserve-3d;
}

.solid-volume {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform-style: preserve-3d;
}

.board-face {
  display: block;
  position: absolute;
  box-sizing: border-box;
  backface-visibility: hidden;
}

.face-left, .face-right { top: 0; bottom: 0; width: var(--solid-depth); }
.face-top, .face-bottom { left: 0; right: 0; height: var(--solid-depth); }

.face-left {
  right: 100%;
  transform-origin: right center;
  transform: rotateY(-90deg);
}
.face-right {
  left: 100%;
  transform-origin: left center;
  transform: rotateY(90deg);
}
.face-top {
  bottom: 100%;
  transform-origin: center bottom;
  transform: rotateX(90deg);
}
.face-bottom {
  top: 100%;
  transform-origin: center top;
  transform: rotateX(-90deg);
}
.face-back {
  inset: 0;
  transform: translateZ(calc(-1 * var(--solid-depth))) rotateY(180deg);
}

.post.solid-safe {
  --solid-depth: 74px;
  left: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
  transform: perspective(1500px) scale(var(--book-zoom, 1))
    rotateX(var(--tilt-x, -15deg)) rotateY(var(--tilt-y, -23deg));
}
.solid-safe::before, .solid-safe::after { content: none; display: none; }
.solid-safe .board-face {
  border: 1px solid color-mix(in srgb, var(--safe-edge) 72%, #3a424c);
  background: var(--safe-edge);
}
.solid-safe .face-top {
  background: linear-gradient(155deg, var(--safe-highlight), var(--safe-face));
}
.solid-safe .face-right {
  background: linear-gradient(90deg, color-mix(in srgb, var(--safe-face) 35%, var(--safe-edge)), var(--safe-edge));
}
.solid-safe .face-left {
  background: linear-gradient(90deg, var(--safe-edge), color-mix(in srgb, var(--safe-face) 67%, var(--safe-edge)));
}
.solid-safe :is(.face-bottom, .face-back) {
  background: color-mix(in srgb, var(--safe-edge) 83%, #323845);
}
.solid-safe .safe-front { box-shadow: inset 0 3px #fff5, inset -2px -3px #34243b16, 0 7px 13px -9px #2f3a4e70; }
.solid-safe :is(.safe-front, .safe-cavity, .safe-door-back) { pointer-events: none; }
.solid-board #layers { transform: translateZ(2px); }
.solid-safe .safe-door { transform: rotateY(0deg) translateZ(1px); }
.solid-safe.safe-opening .safe-door { transform: rotateY(101deg) translateZ(1px); }
.post.solid-safe.is-editing { transform: none; }

/* The recess, shelf, and door rotate within the same cabinet volume. */
.solid-safe .safe-cavity {
  overflow: visible;
  background: transparent;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}
.solid-safe .safe-interior { transform-style: preserve-3d; }
.solid-safe .safe-interior::before,
.solid-safe .safe-interior::after {
  content: "";
  position: absolute;
  pointer-events: none;
}
.solid-safe .safe-interior::before {
  inset: 0;
  transform: translateZ(calc(-.93 * var(--solid-depth)));
  background: radial-gradient(ellipse at 55% 55%, #575463, #31303d 78%);
}
.solid-safe .safe-interior::after {
  inset: 0 100% 0 auto;
  width: var(--solid-depth);
  transform-origin: right center;
  transform: rotateY(-90deg);
  background: linear-gradient(90deg, #393640, #5e5867);
}
.solid-safe .safe-inner-wall {
  inset: 0 auto 0 100%;
  width: var(--solid-depth);
  clip-path: none;
  transform-origin: left center;
  transform: rotateY(90deg);
  background: linear-gradient(90deg, #6d6674, #3f3c48);
}
.solid-safe .safe-inner-floor {
  inset: 100% 0 auto;
  height: var(--solid-depth);
  clip-path: none;
  transform-origin: center top;
  transform: rotateX(-90deg);
  background: linear-gradient(#8d8493, #4b4754);
}
.solid-safe .safe-book {
  transform: translateZ(calc(-.47 * var(--solid-depth))) rotate(-9deg) scale(.92);
}
.solid-safe.safe-opening .safe-book {
  transform: translateZ(calc(-.21 * var(--solid-depth))) rotate(-8deg) scale(1.03);
}

.post.solid-diary {
  --solid-depth: 14px;
  border: 0;
  border-radius: 5px 10px 10px 5px;
  background: transparent;
  box-shadow: none;
}

        }

        let referenceX = 0, referenceY = 0;

          if (active !== session) return;

              const centerY = (box.originY + box.height / 2) / video.videoHeight;

                if (!referenceWidth) {
                  initialWidths.push(width);

                    referenceWidth = initialWidths.sort((a, b) => a - b)[1];
                    referenceX = centerX;
                    referenceY = centerY;

function footprintBounds(points) {

    top = Math.min(top, points[i + 1]);
    bottom = Math.max(bottom, points[i + 1]);

  const scale = clamp(Math.min(image.w / live.w, image.h / live.h), .45, 4);
  const x = (image.x - live.x * scale) * 100;
  const y = (image.y - live.y * scale) * 100;

    const x = item.x + footprint[i] * cos - footprint[i + 1] * sin;
    const y = item.y + footprint[i] * sin + footprint[i + 1] * cos;
    if (x < 7.5 || x > 92.5 || y < 7 || y > 93) return false;
    if (x < 16 || x > 54 || y < 49 || y > 61) continue;

    const dy = Math.max(49 + radius - y, y - (61 - radius), 0);

  const { item, view, node, origin, pose, points, width, height } = placement;
  points.set(event.pointerId, { x: event.clientX, y: event.clientY });
  const next = placementPose(points);
  const change = {
    x: clamp(origin.x + (next.x - pose.x) * 100 / width, view ? 8 : 0, view ? 92 : 32),
    y: clamp(origin.y + (next.y - pose.y) * 100 / height, view ? 8 : 0, view ? 92 : 37),
  };
  if (points.size === 2 && pose.distance > 0) {
    const rotation = (origin.rotation ?? 0) + (next.angle - pose.angle) * 180 / Math.PI;
    change.rotation = Math.round(((rotation + 540) % 360) - 180);
    change.size = clamp(Math.round((origin.size ?? 68) * next.distance / pose.distance), view ? 12 : 20, view ? 86 : 85);
  }
  if (!view) {
    const size = change.size ?? origin.size ?? 68;
    const shift = (size - (origin.size ?? 68)) / 2;
    change.x = clamp(origin.x + (next.x - pose.x) * 100 / width - shift, 0, 100 - size);
    const nextHeight = diaryCardHeight(node, size, item.size ?? 68);
    change.y = clamp(origin.y + (next.y - pose.y) * 100 / height - shift * width / height, 0, 100 - nextHeight);
  }
  applyPlacement(item, change);
  if (view) {
    positionView(view, item);
    updateTransformControls(item);
  } else {
    renderDiary();
    syncDiaryControls();
  }
});

function endPlacement(event) {
  if (!placement?.points.delete(event.pointerId)) return;
  if (!placement.points.size) {
    placement = null;
    elements.post.classList.remove('safe-placement-blocked');
  }
  else rebasePlacement();
}
post.addEventListener('pointerup', endPlacement);
post.addEventListener('pointercancel', endPlacement);
post.addEventListener('lostpointercapture', endPlacement);

function setAngle(view, yaw, pitch) {
  view.yaw = clamp(yaw, -42, 42);
  view.pitch = clamp(pitch, -24, 24);
  const attached = Boolean(draft ? draftPhoto : publishedPhoto);
  view.node.style.setProperty('--contact-x', `${2 + view.yaw * .08}px`);
  view.node.style.setProperty('--contact-y', `${4 + view.pitch * .08}px`);
  view.model?.setAngle(view.yaw * (attached ? .72 : 1), view.pitch * (attached ? .72 : 1));
}

function resetAngle(view, animate = true) {
  cancelAnimationFrame(view.returnFrame);
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setAngle(view, 0, 0);
    return;
  }
  const { yaw, pitch } = view;
  const started = performance.now();
  const tick = now => {
    const t = Math.min(1, (now - started) / 340);
    const remaining = 1 - t * t * (3 - 2 * t);
    setAngle(view, yaw * remaining, pitch * remaining);
    if (remaining > 0) view.returnFrame = requestAnimationFrame(tick);
  };
  view.returnFrame = requestAnimationFrame(tick);
}

function wirePointer(view) {
  const { node } = view;
  let gesture = null;
  node.addEventListener('pointerdown', event => {
    if (event.button !== 0 || gesture || draft || mountedBoard || !view.ready) return;
    gesture = {
      pointer: event.pointerId, startX: event.clientX, startY: event.clientY,
      yaw: view.yaw, pitch: view.pitch,
    };
    cancelAnimationFrame(view.returnFrame);
    if (event.pointerType === 'mouse') node.focus({ preventScroll: true });
    node.setPointerCapture(event.pointerId);
    node.classList.add('dragging');
  });

  node.addEventListener('pointermove', event => {
    if (gesture?.pointer !== event.pointerId) return;
    const dx = event.clientX - gesture.startX;
    const dy = event.clientY - gesture.startY;
    if (!draft) {
      setAngle(view, 42 * Math.tanh((gesture.yaw + dx * .85) / 42), 24 * Math.tanh((gesture.pitch + dy * .65) / 24));
    }
  });

  function end(event) {
    if (gesture?.pointer !== event.pointerId) return;
    gesture = null;
    node.classList.remove('dragging');
    resetAngle(view);
  }
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', end);
  node.addEventListener('lostpointercapture', end);

  node.addEventListener('keydown', event => {
    const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const direction = directions[event.key];
    if (draft) {
      if (!direction && event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      selectItem(view.id);
      if (!direction) return;
      const item = draft.find(item => item.id === view.id);
      applyPlacement(item, {
        x: clamp(item.x + direction[0] * 2, 8, 92),
        y: clamp(item.y + direction[1] * 2, 8, 92),
      });
      positionView(view, item);
      return;
    }
    if (mountedBoard || !view.ready || (!direction && event.key !== 'Escape')) return;
    event.preventDefault();
    if (direction) {
      cancelAnimationFrame(view.returnFrame);
      setAngle(view, view.yaw + direction[0] * 8, view.pitch + direction[1] * 8);
    } else {
      resetAngle(view);
    }
  });
  node.addEventListener('blur', () => {
    if (!draft && !gesture && (view.yaw || view.pitch)) resetAngle(view);
  });
}

function mountBoardModel(view) {
  const { item, node, canvas, status, previewFirst } = view;
  view.model = window.mountGoodmorningModel(canvas, previewFirst ? { ...item, captureFootprint: true } : item, (state, detail) => {
    if (state === 'footprint') {
      scheduleBoard();
      return;
    }
    view.ready = state === 'ready';
    if (!previewFirst || !view.ready) node.classList.toggle('model-ready', view.ready);
    status.hidden = view.ready || Boolean(view.thumbnail);
    status.textContent = state === 'error'
      ? detail || '3D 모델을 불러오지 못했습니다.'
      : '3D 불러오는 중…';
    if (view.ready && mountedBoard) scheduleBoard();
  });
}

function createView(item) {
  const node = document.createElement('div');
  node.className = 'model';
  node.classList.toggle('magnet', Boolean(item.magnet));
  node.classList.toggle('gloss-sticker', item.finish === 'sticker');
  node.dataset.asset = item.id;
  node.tabIndex = 0;
  const canvas = document.createElement('canvas');
  canvas.setAttribute('aria-hidden', 'true');
  const status = document.createElement('p');
  status.className = 'model-status';
  status.setAttribute('role', 'status');
  const thumbnail = item.magnet && magnetThumbnail(item);
  const previewFirst = Boolean(mountedBoard && thumbnail);
  const view = { id: item.id, item, node, canvas, status, thumbnail, previewFirst, model: null, ready: false, yaw: 0, pitch: 0,
    solidMagnet: Boolean(item.magnet && item.finish !== 'sticker' && !item.file) };
  node.classList.toggle('preview-first', previewFirst);
  status.hidden = Boolean(thumbnail);
  if (thumbnail) {
    const fallback = document.createElement('img');
    fallback.className = 'model-preview';
    fallback.alt = '';
    if (previewFirst) fallback.addEventListener('load', () => {
      view.fallbackFootprint = window.goodmorningFootprint(fallback, .1);
      scheduleBoard();
    });
    setCatalogThumbnail(fallback, item);
    node.append(fallback);
  }
  node.append(canvas, status);
  elements.layers.append(node);
  positionView(view, item);
  wirePointer(view);
  if (!previewFirst) mountBoardModel(view);
  return view;
}

function renderItems() {
  const items = activeItems();
  for (const [id, view] of views) {
    if (items.some(item => item.id === id)) continue;
    cancelAnimationFrame(view.returnFrame);
    view.model?.dispose();
    view.node.remove();
    views.delete(id);
  }
  for (const item of items) {
    if (!views.has(item.id)) views.set(item.id, createView(item));
    const view = views.get(item.id);
    positionView(view, item);
    view.node.setAttribute('role', draft ? 'button' : 'group');
    view.node.setAttribute('aria-label', `${item.name} ${item.finish === 'sticker' ? '볼록 스티커' : item.magnet ? '자석' : '3D 모델'}`);
    view.node.tabIndex = draft || !mountedBoard ? 0 : -1;
    if (draft || !mountedBoard) view.node.setAttribute('aria-keyshortcuts', 'ArrowUp ArrowDown ArrowLeft ArrowRight');
    else view.node.removeAttribute('aria-keyshortcuts');
    if (draft) view.node.setAttribute('aria-pressed', String(item.id === selectedId));
    else view.node.removeAttribute('aria-pressed');
  }
  elements.empty.hidden = mountedBoard || items.length !== 0 || Boolean(draft ? draftPhoto : publishedPhoto);
}

function renderPhoto() {
  const photo = draft ? draftPhoto : publishedPhoto;

    URL.revokeObjectURL(photoUrl);

diaryCards.forEach((card, index) => {

});
function matchPaper(image, surface, fallback) {
  surface.style.setProperty('--paper', fallback);
  const source = image.src;
  image.decode().then(() => {
    if (image.src !== source) return;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 16;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(image, 0, 0, 16, 16);
    const pixels = context.getImageData(0, 0, 16, 16).data;
    const swatches = Array.from({ length: 12 }, () => ({ weight: 0, rgb: [0, 0, 0] }));
    for (let index = 0; index < pixels.length; index += 4) {
      const rgb = [pixels[index], pixels[index + 1], pixels[index + 2]];
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const delta = max - min;
      if (delta < 24 || max < 48 || pixels[index + 3] < 100) continue;
      const [r, g, b] = rgb;
      const hue = max === r ? (g - b) / delta : max === g ? 2 + (b - r) / delta : 4 + (r - g) / delta;
      const bucket = swatches[Math.floor(((hue + 6) % 6) * 2)];
      bucket.weight += delta;
      rgb.forEach((value, channel) => { bucket.rgb[channel] += value * delta; });
    }
    const dominant = swatches.reduce((first, next) => next.weight > first.weight ? next : first);
    if (!dominant.weight) return;
    const paper = dominant.rgb.map(value => Math.round(255 * .83 + .17 * value / dominant.weight));
    surface.style.setProperty('--paper', `rgb(${paper.join(',')})`);
  }).catch(() => {});
}

function renderDiary() {
  if (!demo) return;
  const photos = draftDiary ?? diaryPhotos;
  photos.forEach((photo, index) => {
    let card = diaryCards[index];
    if (!card) {
      card = document.createElement('figure');
      card.append(document.createElement('img'), document.createElement('figcaption'));
      card.querySelector('img').alt = '다이어리에 추가한 사진';
      diaryCards[index] = card;
      diary.append(card);
    }
    card.hidden = Boolean(photo.removed || (index < stories.length && index !== storyIndex));
    const image = card.querySelector('img');
    if (card.hidden) {
      if (photo.removed && image.photoUrl) {
        URL.revokeObjectURL(image.photoUrl);
        image.photoUrl = '';
        image.photoFile = null;
        image.removeAttribute('src');
      }
      return;
    }
    card.dataset.photoIndex = index;
    card.dataset.tape = photo.tape ?? 'kraft';
    card.dataset.photoSource = photo.file ? '' : (photo.source ?? '');
    card.classList.toggle('selected-photo', Boolean(draftDiary) && selectedDiaryPhoto === index);
    const size = photo.size ?? 68;
    card.style.left = `${photo.x}%`;
    card.style.top = `${photo.y}%`;
    card.style.width = `${size}%`;
    card.style.setProperty('--placement-angle', `${photo.rotation ?? 0}deg`);
    const original = photo.source
      ? renderedPreviews[`photo-${photo.source}`] ?? `photos/${photo.source}.jpg`
      : index === storyIndex && !newDiaryPage ? image.dataset.original : '';
    const blank = !photo.file && !original;
    card.classList.toggle('blank-diary-card', blank);
    card.style.height = blank ? `${size * .926}%` : '';
    const caption = card.querySelector('figcaption');
    caption.textContent = photo.caption ?? (index === storyIndex && !newDiaryPage ? story.title : '');
    caption.title = caption.textContent;
    const tape = card.querySelector('.photo-tape') ?? document.createElement('span');
    tape.className = 'photo-tape';
    tape.setAttribute('aria-hidden', 'true');
    tape.textContent = ({ cats: 'ᓚᘏᗢ  •  ᓚᘏᗢ', smile: '☺  ☺  ☺  ☺', 'sky-ticket': 'GOOD  •  DAY' })[photo.tape] ?? '';
    if (!tape.parentElement) card.append(tape);
    if (image.photoFile === photo.file && image.appliedSource === original && image.dataset.rendered) return;
    if (image.photoUrl) URL.revokeObjectURL(image.photoUrl);
    image.photoFile = photo.file;
    image.appliedSource = original;
    image.photoUrl = photo.file ? URL.createObjectURL(photo.file) : '';
    if (blank) image.removeAttribute('src');
    else image.src = image.photoUrl || original;
    image.dataset.rendered = 'true';
    if (index === storyIndex) {
      if (blank) diary.style.setProperty('--paper', story.theme);
      else matchPaper(image, diary, story.theme);
    }
  });
  for (const card of diaryCards.splice(photos.length)) {
    const image = card.querySelector('img');
    if (image.photoUrl) URL.revokeObjectURL(image.photoUrl);
    card.remove();
  }
}

if (numberedDiary) {
  const controls = document.getElementById('diary-controls');
  const postInput = document.getElementById('photo-file');
  const picker = document.getElementById('diary-photo-select');
  const fields = document.getElementById('diary-photo-fields');
  const caption = document.getElementById('diary-caption-input');
  const sizeInput = document.getElementById('diary-photo-size');
  const rotationInput = document.getElementById('diary-photo-rotation');
  const tapeChoices = document.getElementById('diary-tapes');
  const selected = () => draftDiary?.[selectedDiaryPhoto];
  const tap = (id, callback) => document.getElementById(id).addEventListener('click', callback);
  let upload = null;
  let requestId = 0;
  document.getElementById('pick-photo').hidden = true;
  controls.hidden = false;
  syncDiaryControls = () => {
    if (!draftDiary) return;
    const indexes = draftDiary.flatMap((photo, index) =>
      !photo.removed && (index === storyIndex || index >= stories.length) ? [index] : []);
    if (!indexes.includes(selectedDiaryPhoto)) selectedDiaryPhoto = indexes[0];
    if (picker.dataset.indexes !== indexes.join(',')) {
      picker.replaceChildren(...indexes.map((index, order) => {
        const option = new Option(`사진 ${order + 1}`, String(index));
        return option;
      }));
      picker.dataset.indexes = indexes.join(',');
    }
    const photo = selected();
    picker.hidden = !photo;
    fields.hidden = !photo;
    if (!photo) return;
    picker.value = selectedDiaryPhoto;
    caption.value = photo.caption ?? (selectedDiaryPhoto === storyIndex && !newDiaryPage ? story.title : '');
    sizeInput.value = photo.size ?? 68;
    rotationInput.value = photo.rotation ?? 0;
    document.getElementById('diary-photo-size-value').textContent = sizeInput.value + '%';
    document.getElementById('diary-photo-rotation-value').textContent = rotationInput.value + '°';
    for (const button of tapeChoices.querySelectorAll('button')) {
      button.setAttribute('aria-pressed', String(button.dataset.tape === (photo.tape ?? 'kraft')));
    }
  };

  picker.addEventListener('change', () => {
    selectedDiaryPhoto = Number(picker.value);
    syncDiaryControls();
    renderDiary();
  });
  caption.addEventListener('input', () => { const photo = selected(); if (photo) { photo.caption = caption.value; renderDiary(); } });
  sizeInput.addEventListener('input', () => {
    const photo = selected();
    if (!photo) return;
    const previousSize = photo.size ?? 68;
    photo.size = Number(sizeInput.value);
    photo.x = Math.min(photo.x, 100 - photo.size);
    photo.y = Math.max(0, Math.min(photo.y, 100 - diaryCardHeight(diaryCards[selectedDiaryPhoto], photo.size, previousSize)));
    syncDiaryControls();
    renderDiary();
  });
  rotationInput.addEventListener('input', () => {
    const photo = selected();
    if (!photo) return;
    photo.rotation = Number(rotationInput.value);
    syncDiaryControls();
    renderDiary();
  });
  for (const [id, label] of tapeStyles) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tape-choice';
    button.dataset.tape = id;
    button.textContent = label;
    button.addEventListener('click', () => {
      const photo = selected();
      if (!photo) return;
      photo.tape = id;
      syncDiaryControls();
      renderDiary();
    });
    tapeChoices.append(button);
  }

  function choosePhoto(index) {
    upload = { layout: draftDiary, index };
    postInput.click();
  }
  tap('diary-photo-add', () => choosePhoto(null));
  tap('diary-photo-replace', () => choosePhoto(selectedDiaryPhoto));
  tap('diary-photo-remove', () => {
    const photo = selected();
    if (!photo) return;
    photo.removed = true;
    delete photo.file;
    syncDiaryControls();
    renderDiary();
  });
  postInput.addEventListener('change', async event => {
    event.stopImmediatePropagation();
    const [file] = postInput.files;
    postInput.value = '';
    if (!file || !upload?.layout) return;
    const { layout, index } = upload;
    const request = ++requestId;
    const url = URL.createObjectURL(file);
    try {
      const image = new Image();
      image.src = url;
      await image.decode();
      if (draftDiary !== layout || saving || request !== requestId) return;
      if (index != null) {
        if (layout[index]?.removed) return;
        layout[index].file = file;
        selectedDiaryPhoto = index;
      } else {
        const base = layout[storyIndex];
        if (newDiaryPage && !base.file && !base.removed) {
          base.file = file;
          selectedDiaryPhoto = storyIndex;
        } else {
          selectedDiaryPhoto = layout.length;
          layout.push({ x: 30, y: 37, size: 38, rotation: 0, tape: 'kraft', file });
        }
      }
      syncDiaryControls();
      renderDiary();
    } catch { notice('사진을 열 수 없습니다.'); }
    finally { URL.revokeObjectURL(url); }
  });
}


function setProductPhoto(image, product, item) {
  const fallback = product.photo ? renderedPreviews[item.sourceId ?? item.id] : '';
  image.onerror = () => {
    image.onerror = null;
    if (fallback) image.src = fallback;
    else {
      image.removeAttribute('src');
      image.hidden = true;
    }
  };
  const source = product.photo ?? renderedPreviews[item.sourceId ?? item.id];
  image.hidden = !source;
  if (source) image.src = source;
  else image.removeAttribute('src');
}

function productLink(label, name, url) {
  const link = document.createElement('a');
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  const title = document.createElement('strong');
  title.textContent = name + ' ↗';
  const caption = document.createElement('span');
  caption.textContent = label;
  link.append(title, caption);
  return link;
}

function openProductCard(product, item) {
  document.getElementById('product-card-title').textContent = product.title;
  document.getElementById('product-card-note').textContent = product.note ?? '';
  const image = document.getElementById('product-card-image');
  image.alt = product.title;
  setProductPhoto(image, product, item);
  const facts = document.getElementById('product-card-facts');
  facts.replaceChildren();
  for (const [label, value] of product.facts ?? []) {
    const term = document.createElement('dt');
    term.textContent = label;
    const description = document.createElement('dd');
    description.textContent = value;
    const pair = document.createElement('div');
    pair.append(term, description);
    facts.append(pair);
  }
  const links = document.getElementById('product-card-links');
  links.replaceChildren();
  for (const [label, name, url] of product.links) links.append(productLink(label, name, url));
  const dialog = document.getElementById('product-card');
  dialog.showModal();
  dialog.scrollTop = 0;
}

function renderProductBookmarks() {
  const rail = elements['diary-bookmarks'];
  rail.replaceChildren();
  const listed = new Set();
  for (const item of published) {
    const key = item.sourceId ?? item.id;
    if (listed.has(key)) continue;
    listed.add(key);
    const product = productCatalog[key] ?? {
      title: item.name,
      note: '연결된 상품 정보가 없어요.',
      links: isWebUrl(item.url) ? [['등록한 판매처', '판매 페이지', item.url]] : [],
    };
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'product-bookmark';
    button.setAttribute('aria-label', `${product.title} 상품 정보`);
    const label = document.createElement('span');
    label.textContent = item.name;
    const picture = document.createElement('img');
    picture.alt = '';
    setProductPhoto(picture, product, item);
    button.append(picture, label);
    button.addEventListener('click', () => openProductCard(product, item));
    rail.append(button);
  }
}

function renderProducts() {
  elements.products.replaceChildren();
  for (const { name, url } of published) {
    const row = document.createElement('li');
    row.className = 'product';
    const label = document.createElement('span');
    label.className = 'product-name';
    label.textContent = name;
    row.append(label);
    if (isWebUrl(url)) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '판매 페이지';
      link.setAttribute('aria-label', `${name} 판매 페이지`);
      row.append(link);
    }
    elements.products.append(row);
  }
}

function renderPicker() {
  const full = draft.length >= maxItems;
  for (const button of elements['asset-list'].querySelectorAll('button')) {
    button.disabled = full || draft.some(item => item.id === button.dataset.asset);
  }
  elements.file.disabled = full;
  document.querySelector('.upload').hidden = full;
}

function selectItem(id) {
  selectedId = id;
  const item = draft.find(item => item.id === id);
  elements.properties.hidden = !item;
  for (const view of views.values()) {
    view.node.setAttribute('aria-pressed', String(view.id === id));
  }
  if (!item) return;
  updateTransformControls(item);
  elements.name.value = item.name;
  elements.url.value = item.url;
  elements.url.setCustomValidity('');
}

function updateMode() {
  const editing = Boolean(draft);
  elements.post.classList.remove('safe-placement-blocked');
  if (editing) stopBoardEffects();
  if (!editing) placement = null;
  elements.edit.hidden = editing || visitingDiary;
  elements['edit-actions'].hidden = !editing;
  if (!demo) elements.editor.hidden = !editing;
  elements.products.hidden = editing || home || demo;
  elements.post.classList.toggle('is-editing', editing);
  renderItems();
  if (!editing && mountedBoard) scheduleBoard();
  renderPhoto();
  renderDiary();
  if (editing) {
    syncDiaryControls();
    renderDiary();
    for (const view of views.values()) {
      view.boardAngle = null;
      if (view.previewFirst) view.node.classList.remove('model-ready');
      resetAngle(view, false);
    }
    renderPicker();
    selectItem(selectedId);
  } else if (demo) {
    renderProductBookmarks();
    void renderDiaryPages().catch(() => {});
  } else if (!home) {
    renderProducts();
  }
  syncDiaryBinder();
}

function addItem(asset) {
  if (!draft || draft.some(item => item.id === asset.id)) return;
  if (draft.length >= maxItems) return;
  const count = draft.length;
  const [x, y] = home ? safeSlots[count] : [count ? 74 : 50, count ? 72 - (count - 1) * 46 : 50];
  const item = { ...asset, x, y, size: home ? 29 : demo ? 31 : count ? 35 : 86, url: asset.url ?? '' };
  draft.push(home ? findSafePlacement(item, count) : item);
  selectedId = asset.id;
  renderItems();
  selectItem(selectedId);
  renderPicker();
}

const groups = mountedBoard ? [['볼록 스티커 추가', stickerAssets], ['3D 자석 추가', displayAssets]] : [['3D 모델 추가', assets]];
for (const [name, options] of groups) {
  const group = document.createElement('section');
  group.className = 'asset-group';
  group.classList.toggle('sticker-options', options === stickerAssets);
  const heading = document.createElement('h3');
  heading.textContent = name;
  const buttons = document.createElement('div');
  buttons.className = 'asset-options';
  for (const asset of options) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'button asset-choice';
    button.dataset.asset = asset.id;
    button.setAttribute('aria-label', `${asset.name} ${name}`);
    if (magnetThumbnail(asset)) {
      const image = document.createElement('img');
      image.alt = '';
      setCatalogThumbnail(image, asset);
      button.append(image);
    }
    const label = document.createElement('span');
    label.textContent = asset.name;
    button.append(label);
    button.addEventListener('click', () => addItem(asset));
    buttons.append(button);
  }
  group.append(heading, buttons);
  elements['asset-list'].append(group);
}

elements.file.addEventListener('change', () => {
  const [file] = elements.file.files;
  elements.file.value = '';
  if (!file) return;
  if (!/\.glb$/i.test(file.name)) return notice('GLB 파일을 선택해 주세요.');
  notice();
  addItem({ id: `file-${crypto.randomUUID()}`, name: file.name.slice(0, -4), file });
});

elements['pick-photo'].addEventListener('click', () => elements['photo-file'].click());
elements['photo-file'].addEventListener('change', async () => {
  const [file] = elements['photo-file'].files;
  elements['photo-file'].value = '';
  if (!file || !draft || saving) return;
  const request = ++photoRequest;
  const url = URL.createObjectURL(file);
  const image = new Image();
  try {
    image.src = url;
    await image.decode();
    if (request !== photoRequest || !draft || saving) return;
    draftPhoto = file;
    notice();
    renderPhoto();
    renderItems();
  } catch {
    if (request === photoRequest && draft) notice('사진을 열 수 없습니다. JPG, PNG 또는 WebP 사진을 선택해 주세요.');
  } finally {
    URL.revokeObjectURL(url);
  }
});

elements['remove-photo'].addEventListener('click', () => {
  photoRequest++;
  draftPhoto = null;
  notice();
  renderPhoto();
  renderItems();
  elements['pick-photo'].focus();
});

elements.edit.addEventListener('click', () => {
  if (visitingDiary) return;
  notice();
  draft = published.map(item => ({ ...item }));
  draftPhoto = publishedPhoto;
  if (demo) {
    diaryOpen = true;
    draftDiary = diaryPhotos.map(photo => ({ ...photo }));
  }
  selectedId = draft[0]?.id ?? null;
  elements.picker.open = true;
  updateMode();
  elements.cancel.focus();
});

elements.cancel.addEventListener('click', () => {
  notice();
  photoRequest++;
  draft = null;
  draftDiary = null;
  updateMode();
  elements.edit.focus();
});

elements.size.addEventListener('input', () => {
  const item = draft.find(item => item.id === selectedId);
  applyPlacement(item, { size: Number(elements.size.value) });
  updateTransformControls(item);
  positionView(views.get(item.id), item);
});

rotationInput.addEventListener('input', () => {
  const item = draft?.find(item => item.id === selectedId);
  if (!item) return;
  applyPlacement(item, { rotation: Number(rotationInput.value) });
  updateTransformControls(item);
  positionView(views.get(item.id), item);
});

elements.name.addEventListener('input', () => {
  draft.find(item => item.id === selectedId).name = elements.name.value;
});
elements.url.addEventListener('input', () => {
  draft.find(item => item.id === selectedId).url = elements.url.value.trim();
  elements.url.setCustomValidity('');
});

elements.remove.addEventListener('click', () => {
  draft = draft.filter(item => item.id !== selectedId);
  selectedId = draft[0]?.id ?? null;
  renderItems();
  selectItem(selectedId);
  renderPicker();
  elements.picker.querySelector('summary').focus();
});

function isWebUrl(value) {
  try { return ['http:', 'https:'].includes(new URL(value).protocol); }
  catch { return false; }
}

elements.publish.addEventListener('click', async () => {
  if (saving) return;
  notice();
  const invalid = draft.find(item => item.url && !isWebUrl(item.url));
  if (invalid) {
    selectItem(invalid.id);
    elements.url.setCustomValidity('http:// 또는 https://로 시작하는 주소를 입력해 주세요.');
    elements.url.reportValidity();
    return;
  }
  saving = true;
  photoRequest++;
  elements.publish.disabled = true;
  elements.cancel.disabled = true;
  elements.editor.inert = true;
  elements.post.inert = true;
  const items = draft.map(item => ({ ...item, name: item.name.trim() || '굿즈' }));
  const photo = draftPhoto;
  try {
    await writePost(items, photo, draftDiary);
    if (home) saveHomePreview(items);
  } catch {
    notice('이 브라우저에 저장하지 못했습니다. 현재 화면에서만 게시물이 유지됩니다.');
  } finally {
    published = items;
    publishedPhoto = photo;
    if (draftDiary) diaryPhotos = draftDiary;
    draftDiary = null;
    draft = null;
    saving = false;
    elements.publish.disabled = false;
    elements.cancel.disabled = false;
    elements.editor.inert = false;
    elements.post.inert = false;
    updateMode();
    elements.edit.focus();
  }
});

function wireAssetPreview() {
  const dialog = document.getElementById('asset-preview');
  const stage = document.getElementById('preview-stage');
  const image = document.getElementById('preview-image');
  const status = document.getElementById('preview-status');
  const slider = document.getElementById('preview-angle');
  const pitchSlider = document.getElementById('preview-pitch');
  const pitchRow = document.getElementById('preview-pitch-row');
  let model = null;
  let drag = null;
  let revision = 0;
  const setPreviewAngle = (yaw, pitch) => {
    slider.value = clamp(yaw, Number(slider.min), Number(slider.max));
    pitchSlider.value = pitchRow.hidden ? 0 : clamp(pitch, -38, 38);
    model?.setAngle(Number(slider.value), Number(pitchSlider.value));
  };
  for (const input of [slider, pitchSlider]) input.addEventListener('input',
    () => setPreviewAngle(Number(slider.value), Number(pitchSlider.value)));
  stage.addEventListener('pointerdown', event => {
    if (slider.disabled || drag || event.button !== 0) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, yaw: Number(slider.value), pitch: Number(pitchSlider.value) };
    stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener('pointermove', event => {
    if (drag?.id === event.pointerId) setPreviewAngle(drag.yaw + (event.clientX - drag.x) * .48,
      drag.pitch - (event.clientY - drag.y) * .48);
  });
  const end = event => { if (drag?.id === event.pointerId) drag = null; };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('lostpointercapture', end);
  dialog.addEventListener('close', () => {
    if (dialog.open) return;
    revision++;
    drag = null;
    model?.dispose();
    model = null;
  });
  return (asset, storyId, thumbnail) => {
    model?.dispose();
    const token = ++revision;
    const oldCanvas = document.getElementById('preview-canvas');
    const canvas = oldCanvas.cloneNode();
    oldCanvas.replaceWith(canvas);
    image.hidden = false;
    if (thumbnail) image.src = thumbnail;
    else image.removeAttribute('src');
    slider.disabled = true;
    slider.value = 0;
    const magnet = Boolean(asset.magnet && asset.finish !== 'sticker');
    slider.min = magnet ? -46 : -25;
    slider.max = magnet ? 46 : 25;
    pitchRow.hidden = !magnet;
    pitchSlider.disabled = true;
    pitchSlider.value = 0;
    status.textContent = '3D 모델 불러오는 중…';
    document.getElementById('preview-title').textContent = `${asset.name} · ${asset.finish === 'sticker' ? '볼록 스티커' : '3D 자석'}`;
    document.getElementById('preview-diary').href = `?magnets&story=${storyId}&open`;
    dialog.showModal();
    model = window.mountGoodmorningModel(canvas, asset, state => {
      if (token !== revision || !dialog.open) return;
      if (state === 'ready') {
        slider.disabled = false;
        pitchSlider.disabled = !magnet;
        image.hidden = true;
        status.textContent = '';
      } else if (state === 'error') status.textContent = '3D 모델을 불러오지 못해 정면 이미지를 표시합니다.';
    });
  };
}

if (!showPost) {
  if (section === 'browse') {
    for (const index of [0, 1]) {
      const card = document.createElement('a');
      card.className = 'browse-card';
      card.href = `?magnets&story=${stories[index].id}`;
      card.setAttribute('aria-label', stories[index].title);
      const art = document.createElement('img');
      art.className = 'diary-capture';
      art.src = renderedPreviews[`diary-${stories[index].id}`] ?? `photos/${stories[index].id}-completed.jpg`;
      art.alt = '';
      card.append(art);
      document.getElementById('browse').append(card);
    }
  }
  if (section === 'assets') {
    const collection = document.getElementById('collection');
    document.getElementById('add-asset').addEventListener('click', () => document.getElementById('capture-plan').showModal());
    const openPreview = wireAssetPreview();
    for (const [title, items] of [['볼록 스티커', stickerAssets], ['3D 자석', displayAssets]]) {
      const heading = document.createElement('h2');
      heading.textContent = title;
      const grid = document.createElement('div');
      grid.className = 'collection-grid';
      for (const asset of items) {
        const tile = document.createElement('button');
        tile.type = 'button';
        const storyId = stories[displayAssets.findIndex(sample => sample.id === (asset.sourceId ?? asset.id))].id;
        tile.setAttribute('aria-label', `${asset.name} ${title} 미리보기`);
        const image = document.createElement('img');
        image.alt = '';
        setCatalogThumbnail(image, asset);
        const caption = document.createElement('span');
        caption.textContent = asset.name;
        tile.addEventListener('click', () => openPreview(asset, storyId, image.currentSrc));
        tile.append(image, caption);
        grid.append(tile);
      }
      collection.append(heading, grid);
    }
  }
} else if (visitingDiary) {
  elements.edit.disabled = true;
  document.getElementById('post-view').setAttribute('aria-label', '다른 사람의 다이어리');
  updateMode();
} else {
if (homePreview) updateMode();
elements.edit.disabled = true;
let pageExists = false;
readPost().then(post => {
  pageExists = Boolean(post);
  if (Array.isArray(post)) published = post.filter(item => !item.sticker);
  else if (Array.isArray(post?.items)) {
    published = post.items.filter(item => !item.sticker);
    publishedPhoto = post.photo ?? null;
    if (demo && Array.isArray(post.diaryLayout) && post.diaryLayout.length >= stories.length) {
      diaryPhotos = post.diaryLayout;
      if (numberedDiary && !newDiaryPage && post.diaryLayoutVersion !== diaryLayoutVersion) {
        const cover = diaryPhotos[storyIndex];
        if (cover && !cover.removed && cover.size > 52) {
          const previousSize = cover.size;
          cover.size = firstPageCover.size;
          cover.x = clamp(cover.x + (previousSize - cover.size) / 2, 0, 100 - cover.size);
        }
      }
      if (numberedDiary && !newDiaryPage && diaryPhotos.length === stories.length) {
        diaryPhotos = [...diaryPhotos, ...firstPageExtras.map(photo => ({ ...photo }))];
      }
    }
  }
}).catch(() => {}).finally(() => {
  if (home) {
    if (!homePreview) published = published.map(findSafePlacement);
    if (pageExists) saveHomePreview(published);
  }
  updateMode();
  elements.edit.disabled = false;
  if (newDiaryPage && !pageExists) elements.edit.click();
});
}


</script>
</body>
</html>
