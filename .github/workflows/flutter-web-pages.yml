name: Flutter Web Pages
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and validate the Flutter web artifact
        env:
          PAGES_BASE: /goodmorning-prototype-demo/
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          output = Path("_site")
          output.mkdir()
          for name in ("assets", "canvaskit", "icons"):
              shutil.copytree(name, output / name)
          for name in ("favicon.png", "flutter.js", "flutter_bootstrap.js",
                       "flutter_service_worker.js", "main.dart.js", "manifest.json",
                       "version.json"):
              shutil.copy2(name, output / name)
          index = Path("index.html").read_text(encoding="utf-8")
          base = '<base href="/">'
          if index.count(base) != 1 or "flutter_bootstrap.js" not in index:
              raise SystemExit("Unexpected Flutter entry point")
          if not (output / "assets/AssetManifest.bin.json").is_file():
              raise SystemExit("Flutter asset manifest is missing")
          if not (output / "canvaskit/canvaskit.wasm").is_file():
              raise SystemExit("Flutter renderer is missing")
          (output / "index.html").write_text(
              index.replace(base, f'<base href="{os.environ["PAGES_BASE"]}">'),
              encoding="utf-8",
          )
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
