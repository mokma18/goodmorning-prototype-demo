name: Generate photo sticker
on:
  push:
    paths:
      - .github/workflows/photo-sticker.yml
      - tools/photo_sticker.py
  workflow_dispatch:
    inputs:
      photo:
        description: 'Repository path to a JPG, PNG or WebP (empty uses the public demo photo)'
        required: false
        type: string
      box:
        description: 'Normalized rectangle: left top right bottom'
        default: '0.16 0.07 0.96 0.94'
        required: true
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy<2' pillow scipy hydra-core iopath tqdm imageio-ffmpeg==0.6.0
      - name: Prepare SAM 2 and the input photo
        env:
          PHOTO_PATH: ${{ inputs.photo }}
        run: |
          set -euo pipefail
          mkdir -p .sticker-work sticker-result
          git init -q .sticker-work/sam2-source
          git -C .sticker-work/sam2-source fetch -q --depth 1 https://github.com/facebookresearch/sam2.git 2b90b9f5ceec907a1c18123530e92e794ad901a4
          git -C .sticker-work/sam2-source checkout -q --detach FETCH_HEAD
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt \
            --output .sticker-work/model.pt
          if [[ -z "$PHOTO_PATH" ]]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://bloodmoon3929.github.io/goodmorning-3d/viewer/data/2026_11_24_08_15/video.mp4 \
              --output .sticker-work/demo.mp4
            ffmpeg="$(python -c 'from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())')"
            "$ffmpeg" -nostdin -loglevel error -i .sticker-work/demo.mp4 -frames:v 1 .sticker-work/demo.png
            export PHOTO_PATH=.sticker-work/demo.png
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path.cwd().resolve()
          photo = (root / os.environ["PHOTO_PATH"]).resolve(strict=True)
          if not photo.is_relative_to(root) or photo.suffix.lower() not in {".jpg", ".jpeg", ".png", ".webp"}:
              raise SystemExit("Select a JPG, PNG or WebP inside the repository.")
          if photo.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit("The photo must be 8 MB or smaller.")
          with Image.open(photo) as image:
              frame = ImageOps.exif_transpose(image).convert("RGB")
              frame.thumbnail((960, 960))
              frame.save(".sticker-work/input.png")
          PY
      - name: Segment and export the flat-backed sticker
        env:
          PHOTO_BOX: ${{ inputs.box || '0.16 0.07 0.96 0.94' }}
          PYTHONPATH: .sticker-work/sam2-source:tools
        run: |
          python - <<'PY'
          import json
          import os
          import struct
          from pathlib import Path
          from photo_sticker import mask_photo, relief

          box = [float(value) for value in os.environ["PHOTO_BOX"].split()]
          if len(box) != 4 or not (0 <= box[0] < box[2] <= 1 and 0 <= box[1] < box[3] <= 1):
              raise SystemExit("Provide four normalized rectangle coordinates.")
          work = Path(".sticker-work")
          photo = work / "input.png"
          mask = work / "mask.png"
          result = Path("sticker-result")
          output = result / "sticker.glb"
          mask_photo(photo, mask, work / "model.pt", box)
          relief(photo, mask, output)
          data = output.read_bytes()
          magic, version, total = struct.unpack_from("<4sII", data)
          assert (magic, version, total) == (b"glTF", 2, len(data))
          length = struct.unpack_from("<I", data, 12)[0]
          document = json.loads(data[20:20 + length])
          texture = document["bufferViews"][document["images"][0]["bufferView"]]
          start = 28 + length + texture["byteOffset"]
          (result / "preview.png").write_bytes(data[start:start + texture["byteLength"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: goodmorning-sticker
          path: sticker-result/
          if-no-files-found: error
          retention-days: 14
